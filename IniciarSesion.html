<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">MI LOGO</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="servicios.html" class="nav-link">Servicios</a></li>
                <li class="nav-item"><a href="portafolio.html" class="nav-link">Portafolio</a></li>
                <li class="nav-item"><a href="contacto.html" class="nav-link">Contacto</a></li>
                <li class="nav-item"><a href="IniciarSesion.html" class="nav-link btn-login">Iniciar Sesión</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>

        <section class="auth-container">

            <div class="auth-forms">

                <div class="auth-tabs">
                    <button class="auth-tab active" id="login-tab">Iniciar Sesión</button>
                    <button class="auth-tab" id="register-tab">Registrarse</button>
                </div>

                <!-- LOGIN -->
                <form id="login-form" class="auth-form active">
                    <h2>Accede a tu cuenta</h2>

                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="********" required>
                    </div>

                    <button type="submit" class="auth-submit">Entrar</button>
                    <p id="login-message" class="auth-message"></p>
                </form>

                <!-- REGISTRO -->
                <form id="register-form" class="auth-form">
                    <h2>Crea una nueva cuenta</h2>

                    <div class="form-group">
                        <label for="register-name">Nombre Completo</label>
                        <input type="text" id="register-name" placeholder="Juan Roberto" required>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Correo Electrónico</label>
                        <input type="email" id="register-email" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Contraseña</label>
                        <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm">Confirmar contraseña</label>
                        <input type="password" id="register-confirm" placeholder="Repite tu contraseña" required>
                    </div>

                    <button type="submit" class="auth-submit">Registrarse</button>
                    <p id="register-message" class="auth-message"></p>
                </form>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
